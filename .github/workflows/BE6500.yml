# SPDX-License-Identifier: MIT
# FanWRT —— 京东云 BE6500（IPQ53XX）专用编译流程

name: BE6500

on:
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean
  #配置推送后自动编译
  push:
    branches:
      - main
    paths:
      - 'Config/**'
      - 'Scripts/**'
      - 'Packages/**'
      - '.github/workflows/BE6500.yml'
      - '.github/workflows/WRT-CORE.yml'

#CI权限
permissions: write-all

#避免重复排队
concurrency:
  group: be6500-${{github.ref}}
  cancel-in-progress: false

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        #只编译 IPQ53XX（京东云 BE6500）一个配置
        CONFIG: [IPQ53XX]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: FanWRT
      #默认WIFI名称
      WRT_SSID: FanWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
